name: Bot Chandelier Exit

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *' 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360 

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Bot
        # Ya no hay 'env:', así que usará los datos que escribiste en bot.py
        run: timeout 21300 python bot.py
